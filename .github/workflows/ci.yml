name: CI

# Incluye la prueba diferencial contra el oráculo Python, que aquí corre sin
# necesitar Python: compara contra `herramientas/salida-python.json`, el archivo
# dorado versionado. Ver `tests/oraculo.test.ts`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    name: Typecheck y suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Incluye el barrido de los 50 valores de frontera (regla de oro 1), la
      # prueba diferencial contra el oráculo y los tests de arquitectura.
      - name: Suite
        run: npm test

      # La aplicación se exporta estática. Que el build pase es parte del
      # contrato: si dejara de exportarse, habría un servidor recibiendo notas.
      - name: Build estático
        run: npm run build
